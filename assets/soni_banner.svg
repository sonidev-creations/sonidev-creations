<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="50%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8892b0"/>
      <stop offset="50%" stop-color="#f0f2f7"/>
      <stop offset="100%" stop-color="#8892b0"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#1a1a2e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <g fill="#8892b0">
    <circle cx="90" cy="60" r="1.6" opacity="0.7">
      <animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="220" r="1.3" opacity="0.5">
      <animate attributeName="opacity" values="0.1;0.8;0.1" dur="4.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="55" r="1.6" opacity="0.6">
      <animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1130" cy="230" r="1.3" opacity="0.5">
      <animate attributeName="opacity" values="0.1;0.7;0.1" dur="2.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="150" r="1.2" opacity="0.5">
      <animate attributeName="opacity" values="0.1;0.8;0.1" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="230" cy="130" r="1.2" opacity="0.5">
      <animate attributeName="opacity" values="0.1;0.7;0.1" dur="4.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="170" r="1.4" opacity="0.5">
      <animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1150" cy="140" r="1.4" opacity="0.5">
      <animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="150" y="175" font-family="DejaVu Sans Mono, monospace" font-size="46"
        fill="#3a3f55" opacity="0.7" text-anchor="middle">&lt;/&gt;</text>
  <text x="1050" y="175" font-family="DejaVu Sans Mono, monospace" font-size="46"
        fill="#3a3f55" opacity="0.7" text-anchor="middle">{ }</text>

  <text x="600" y="168" font-family="DejaVu Sans Mono, monospace" font-size="92" font-weight="bold"
        fill="url(#textGrad)" text-anchor="middle" letter-spacing="6" filter="url(#glow)">SONI</text>

  <rect x="510" y="195" width="180" height="3" fill="#8892b0" opacity="0.85"/>

  <text x="600" y="235" font-family="DejaVu Sans Mono, monospace" font-size="21"
        fill="#8892b0" text-anchor="middle" letter-spacing="1">AI/ML Builder &amp; Researcher</text>

  <rect x="878" y="219" width="11" height="22" fill="#8892b0">
    <animate attributeName="opacity" values="1;1;0;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <rect width="1200" height="300" fill="url(#vignette)"/>
</svg>
